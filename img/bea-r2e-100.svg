<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="BEA R2E-100 request-to-exit sensor, illustration">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#e2e8f2" stroke-width="1"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#dfe6f0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3446"/>
      <stop offset="1" stop-color="#161d2b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="270" fill="#f5f7fb"/>
  <rect width="480" height="270" fill="url(#g)"/>

  <!-- focused active-IR beam onto handle -->
  <path d="M240 150 L188 236 L292 236 Z" fill="url(#beam)"/>
  <line x1="240" y1="150" x2="210" y2="232" stroke="#0d9488" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="240" y1="150" x2="270" y2="232" stroke="#0d9488" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- door lever target -->
  <rect x="224" y="232" width="32" height="8" rx="3" fill="#e3e9f1" stroke="#9aa6b8" stroke-width="1.4"/>
  <rect x="248" y="228" width="9" height="16" rx="2.5" fill="#e3e9f1" stroke="#9aa6b8" stroke-width="1.4"/>
  <text x="240" y="256" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#586780" text-anchor="middle">door lever</text>

  <!-- sensor housing -->
  <rect x="96" y="86" width="288" height="70" rx="12" fill="url(#body)" stroke="#9aa6b8" stroke-width="1.8"/>
  <rect x="96" y="86" width="288" height="70" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" transform="translate(0 1.4)"/>
  <!-- lens band -->
  <rect x="120" y="104" width="200" height="34" rx="7" fill="url(#lens)"/>
  <rect x="120" y="104" width="200" height="34" rx="7" fill="none" stroke="#0d1420" stroke-width="1"/>
  <!-- lens facets -->
  <g opacity="0.5">
    <line x1="153" y1="104" x2="153" y2="138" stroke="#3c465c" stroke-width="1"/>
    <line x1="186" y1="104" x2="186" y2="138" stroke="#3c465c" stroke-width="1"/>
    <line x1="220" y1="104" x2="220" y2="138" stroke="#3c465c" stroke-width="1"/>
    <line x1="254" y1="104" x2="254" y2="138" stroke="#3c465c" stroke-width="1"/>
    <line x1="287" y1="104" x2="287" y2="138" stroke="#3c465c" stroke-width="1"/>
  </g>
  <!-- status LED -->
  <circle cx="344" cy="121" r="5.5" fill="#0d9488"/>
  <circle cx="344" cy="121" r="5.5" fill="none" stroke="#0b7a6d" stroke-width="1"/>

  <!-- labels -->
  <text x="240" y="52" font-family="'Archivo', sans-serif" font-size="17" font-weight="700" fill="#16202e" text-anchor="middle" letter-spacing="0.5">BEA R2E-100</text>
  <text x="240" y="70" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#b8382c" text-anchor="middle" letter-spacing="1.5">FOCUSED ACTIVE-INFRARED REX</text>
</svg>
